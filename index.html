<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- resizes-content : le clavier du téléphone / de la tablette rapetisse la page au lieu de la faire glisser (en-tête, pilule et « + » restent à l'écran ; src/clavier.ts) -->
    <meta name="description" content="Tâches, séances et sondages du club." />
    <!-- Aperçu d'un lien envoyé par WhatsApp, email… (titre changé avec le nom de l'appli : scripts/icones-club.mjs) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tâches GSA" />
    <meta property="og:description" content="Tâches, séances et sondages du club." />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-192.png" type="image/png" sizes="192x192" />
    <!-- iPhone / iPad : icône et mode plein écran une fois ajoutée à l'écran d'accueil -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tâches GSA" />
    <!-- Nom de l'appli (changé à la publication si le comité central en a choisi un : scripts/icones-club.mjs) -->
    <meta name="application-name" content="Tâches GSA" />
    <title>Tâches GSA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
