# Publie l'application sur GitHub Pages à chaque mise à jour de la branche principale
# (et quand le nom ou l'icône de l'appli change : workflow icone-club.yml).
name: Publication GitHub Pages

on:
  push:
    branches: [main, claude/great-clarke-bk56z3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu 24.04 : Playwright 1.56 ne sait pas encore installer Chromium sur ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Contrôle du code (ESLint), puis construction (vérifie aussi les types).
      - run: npm run lint
      - run: npm run build
      # Tests automatiques de la démo (dossier tests/) : si l'un d'eux échoue, rien n'est publié.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      # Paquets système du navigateur (surtout des polices) : l'image du serveur a déjà l'essentiel. Si le miroir Ubuntu
      # ne répond pas (11.11.2026 : deux publications bloquées), on continue : il reste les tests, qui échouent (et
      # rien n'est publié) s'il manque vraiment quelque chose.
      - run: npx playwright install-deps chromium
        continue-on-error: true
        timeout-minutes: 5
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: test-results/
          retention-days: 7
      # Nom et icône de l'appli choisis dans la console admin (migration 017), sinon ceux d'origine.
      - run: node scripts/icones-club.mjs publier dist
      - id: pages
        uses: actions/configure-pages@v5
      # Fichiers des versions précédentes gardés : une appli restée ouverte pendant la publication charge encore le PDF, la carte…
      - run: node scripts/anciens-assets.mjs dist "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
