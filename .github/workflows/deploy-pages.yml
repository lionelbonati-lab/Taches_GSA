# Publie l'application sur GitHub Pages à chaque mise à jour de la branche principale
# (et quand l'icône de l'appli change : workflow icone-club.yml).
name: Publication GitHub Pages

on:
  push:
    branches: [main, claude/great-clarke-bk56z3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Icône de l'appli choisie dans la console admin (logo du club, migration 017), sinon celle d'origine.
      - run: node scripts/icones-club.mjs publier dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
